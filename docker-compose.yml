services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: podtafolio
      POSTGRES_PASSWORD: podtafolio
      POSTGRES_DB: podtafolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podtafolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
